name: WakeGuard iOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            major: 26
          - runner: xcode-27
            major: 27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode and iPhone SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project WakeGuard.xcodeproj -scheme WakeGuard -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/WakeGuard-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package iPhone app for personal signing
        if: matrix.major == 27
        run: |
          app="$RUNNER_TEMP/WakeGuard-build/Build/Products/Release-iphoneos/WakeGuard.app"
          test -x "$app/WakeGuard"
          test -x "$app/PlugIns/WakeGuardActivity.appex/WakeGuardActivity"
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          ditto "$app" Payload/WakeGuard.app
          /usr/bin/zip -qry -y WakeGuard.ipa Payload
          unzip -tq WakeGuard.ipa
          shasum -a 256 WakeGuard.ipa
      - name: Upload iPhone IPA
        if: matrix.major == 27
        uses: actions/upload-artifact@v4
        with:
          name: WakeGuard-iPhone
          path: ${{ runner.temp }}/WakeGuard.ipa
          if-no-files-found: error
      - name: Test on iPhone simulator
        env:
          IOS_MAJOR: ${{ matrix.major }}
        run: |
          DEVICE=$(python3 scripts/simulator.py "$IOS_MAJOR")
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project WakeGuard.xcodeproj -scheme WakeGuard -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath WakeGuardTests.xcresult test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XCTest-iOS-${{ matrix.major }}
          path: WakeGuardTests.xcresult
          if-no-files-found: ignore

